<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark glassmorphic background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="50%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Glowing accent gradient for the upward trend -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="50%" stop-color="#f5c2e7" />
      <stop offset="100%" stop-color="#f9e2af" />
    </linearGradient>

    <!-- Glossy reflection overlay -->
    <linearGradient id="glossGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Intense drop shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Grid pattern to make it look like a real technical trading dashboard -->
  <g opacity="0.08" stroke="#bac2de" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Decorative technical circular rings resembling a performance tracker -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fab387" stroke-width="1.5" stroke-dasharray="10 25" opacity="0.15" />
  <circle cx="256" cy="256" r="225" fill="none" stroke="#a6e3a1" stroke-width="1" opacity="0.1" />

  <!-- Candlestick chart nodes and ascending peaks -->
  <g filter="url(#glow)">
    <!-- Candle 1: Lower Left -->
    <line x1="130" y1="320" x2="130" y2="400" stroke="#f38ba8" stroke-width="3" opacity="0.75" />
    <rect x="118" y="340" width="24" height="40" rx="4" fill="#f38ba8" />

    <!-- Candle 2: Neutral mid branch -->
    <line x1="200" y1="240" x2="200" y2="360" stroke="#94e2d5" stroke-width="3" opacity="0.7" />
    <rect x="188" y="270" width="24" height="60" rx="4" fill="#94e2d5" />

    <!-- Candle 3: Rising node -->
    <line x1="270" y1="170" x2="270" y2="290" stroke="url(#chartGrad)" stroke-width="4" />
    <rect x="256" y="190" width="28" height="70" rx="6" fill="url(#chartGrad)" />

    <!-- Candle 4: Peak high -->
    <line x1="340" y1="100" x2="340" y2="210" stroke="#a6e3a1" stroke-width="4" />
    <rect x="326" y="120" width="28" height="60" rx="6" fill="#a6e3a1" />

    <!-- Candle 5: Rocket break-out level -->
    <line x1="410" y1="60" x2="410" y2="150" stroke="#f9e2af" stroke-width="4" />
    <rect x="396" y="75" width="28" height="50" rx="6" fill="#f9e2af" />
  </g>

  <!-- Elegant vector overlay trendline linking the candle bodies -->
  <path d="M 130 360 Q 200 300 270 225 T 410 100" fill="none" stroke="url(#chartGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 130 360 Q 200 300 270 225 T 410 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Dynamic glowing target spark at peak breakout point -->
  <circle cx="410" cy="100" r="16" fill="#ffffff" filter="url(#glow)" />
  <circle cx="410" cy="100" r="8" fill="#f9e2af" />

  <!-- Gorgeous corner highlights and top reflection -->
  <rect width="512" height="512" rx="128" fill="url(#glossGrad)" pointer-events="none" />
</svg>
